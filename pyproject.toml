[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bks-pipeline-core"
version = "0.1.6"
requires-python = ">=3.13"
dependencies = [
    "firebase-admin>=7.4.0",
    "firebase_functions>=0.5.0",
    "google-cloud-tasks>=2.22.0",
    "requests>=2.33.1",
    "anthropic>=0.49.0,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bks_pipeline_core*"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
