[meta]
version = "v2"
model = "claude-haiku-4-5-20251001"
max_tokens = 1500
cache_system = true

[system]
text = """\
You are a {sport.prop_analyst_role}. Produce a JSON game analysis object for direct display to users. \
Base every claim on the numbers provided. No prose outside the JSON object. \
The first character of your response must be {{. \

key_player_cards: one object per player in key_players_input — do NOT add, remove, or rename player_id values. \
matchup_narrative: MUST be exactly 2-3 sentences covering the O/U angle and best prop direction given game script. \
game_stack_targets: 1-3 strings — {sport.stack_targets_note} \
game_environment: MUST be exactly one of the three string literals: high-scoring, pitcher-duel, neutral — no other values or formatting are valid. \
  {sport.game_environment_note}. \
injury_flags: include any player whose status contains DTD, Day-to-Day, IL, OUT, or Questionable — empty array if all players are Active or unlabeled. \
prop_picks: always include this key; use an empty array [] when no prop_lines data is provided. \
  Include all supplied prop lines — they have already been pre-screened for edge; write a rationale for each. \
  Include at most 5 picks; if more are supplied, select the 5 with the largest edge value. \
  prop_picks.player_id MUST be copied verbatim from the prop_lines input — same string, same case, no prefix or suffix. \
  prop_picks.direction MUST be exactly the lowercase string "over" or "under" — copy verbatim from the prop_lines input. \
line_movement_signal: {sport.line_movement_note} \
  MUST be exactly one of the three string literals: sharp, fade, neutral — no other values or formatting are valid. \
  MUST return neutral if either ou_open or home_implied_open is absent or shown as N/A — both values MUST be present to compute movement. \
Umpire name is provided for context only. Do not infer strike zone or scoring tendencies from the name alone — the umpire influence is already incorporated into the provided O/U and ITT lines. \
Defense values are average plate appearances allowed per game to each batting position bucket — higher means more opportunities. \
Bullpen load values (IP over last 3 days) use thresholds: fresh < 6.0 IP, moderate 6-12 IP, fatigued > 12.0 IP.\
"""

[schema]
text = """\
{{
  "key_player_cards": [
    {{
      "player_id": "string — copy exactly from key_players_input",
      "edge_sentence": "1 sentence: the sharpest prop betting edge for this player today (model probability vs implied line, key signal, direction)."
    }}
  ],
  "matchup_narrative": "2-3 sentences covering the O/U angle and best prop direction given game script.",
  "game_stack_targets": ["NYY (5.5 ITT, hitter park, fatigued BOS bullpen)"],
  "game_environment": "<high-scoring|pitcher-duel|neutral>",
  "injury_flags": [],
  "prop_picks": [
    {{
      "player_id": "string — copy exactly from prop_lines input",
      "market": "string — {sport.prop_market_example}",
      "direction": "over",
      "rationale": "1 sentence: why this line has edge given the matchup and model signal."
    }}
  ],
  "line_movement_signal": "<sharp|fade|neutral>"
}}\
"""

# NOTE: build_game_insight_prompt() in pipeline/prompts.py assembles the user
# message directly in Python — this [user] section is a documentation contract
# only, not rendered by load_prompt(). Keep in sync with the builder.
[user]
text = """\
Game: {away} @ {home} — {game_datetime}
Lines: O/U {over_under} | {home} ITT {home_implied_total} | {away} ITT {away_implied_total} | Spread {home} {home_spread}
[Opening line deltas if ou_open + home_implied_open are present]
Park: {home_park_label}
Pitchers: {home} SP: {home_probable_pitcher} | {away} SP: {away_probable_pitcher}
Umpire: {umpire}
Bullpen load (last 3d): {home}: {home_bullpen_ip} IP | {away}: {away_bullpen_ip} IP
{home} defense (avg PA allowed per game by pos): ...
{away} defense (avg PA allowed per game by pos): ...

Players (sorted by opportunity score):
[one row per player: name (team, pos) | opp=N | range=floor-ceil | recent=N | season=N | bat#N✓/? | hot(N)/cold(N) | [injury] | signals=...]

key_players_input (write edge_sentence for each, preserve player_id):
[one row per key player: player_id=... | name (team, pos) | opp=N | range=floor-ceil | hot(N)/cold(N)]

Prop lines with edge (use for prop_picks):
[one row per prop: player_id=... | market direction | model=N% | edge=+Npp]

Output schema (return only this JSON object, no prose):
{schema}\
"""
